services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: practice-vue-app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - practice-vue-network

  node:
    image: node:20-alpine
    container_name: practice-vue-node
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - app
    networks:
      - practice-vue-network

  db:
    image: mariadb:10.11
    container_name: practice-vue-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: practice_vue
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - practice-vue-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: practice-vue-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - practice-vue-network

volumes:
  db_data:
  vendor_data:
  node_modules_data:

networks:
  practice-vue-network:
    driver: bridge
